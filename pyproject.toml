[project]
name = "tempo"
version = "0.1.0"
description = "Tempo: before the moment, the stake; after it, the reason. A football broadcast layer built on synthetic match data."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "torch>=2.2"]

# The Azure adapters (tempo/azure/). Without them, and without TEMPO_AZURE_* settings, every part runs on its local
# stand-in. `uv sync --extra azure` installs them; the container image always has them
[project.optional-dependencies]
azure = [
  "azure-identity>=1.19",
  "azure-cognitiveservices-speech>=1.41",
  "azure-eventhub>=5.12",
  "azure-cosmos>=4.7",
  "azure-messaging-webpubsubservice>=1.2",
  "azure-search-documents>=11.5",
  "azure-storage-blob>=12.23",
  "azure-monitor-opentelemetry>=1.6",
  "openai>=1.60",
]

[dependency-groups]
dev = ["ruff>=0.6", "pyright>=1.1.380", "pytest>=8"]

# On Linux (CI, containers) torch comes from PyTorch's CPU-only index: the PyPI build carries CUDA libraries Tempo never uses
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
tempo = "tempo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tempo*"]

[tool.setuptools.package-data]
tempo = ["stake/dfl_sources.tsv"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", "private", "web", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RUF"]
ignore = ["E501", "E741", "E731", "RUF001", "RUF003", "C408"]  # dict(...) is the house style for records

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs whole matches through the pipeline"]

[tool.pyright]
include = ["tempo", "tests", "experiments", "tools"]
# needs mlx-audio, which runs only on Apple Silicon and is not a project dependency
exclude = ["tools/commentator_voice.py"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
