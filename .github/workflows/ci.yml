# Every push: the Python checks with the Azure adapters, the pipeline's own checks on the demo match and the live path,
# the site built and opened in a browser, and the services' image and the infrastructure built.
name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra azure
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: The site's types match the pipeline's schema
        run: uv run tempo types --check
      - name: Unit tests
        run: uv run pytest -m "not slow"

  pipeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: The demo match reproduced byte for byte, and the live path over the bus
        run: uv run pytest -m slow
      - name: The pipeline's checks
        run: uv run tempo check

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format
        run: bun run lint
      - name: Types
        run: bun run typecheck
      - name: Unit tests
        run: bun test web/src
      - run: bunx playwright install --with-deps chromium
      - name: Every page, built and opened
        run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages
          path: web/e2e/results

  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The services' image
        run: docker build -t tempo .
      - name: The image starts and knows its commands
        run: docker run --rm tempo --help
      - name: The infrastructure compiles and passes the linter
        run: az bicep build --file infra/main.bicep --stdout > /dev/null && az bicep lint --file infra/resources.bicep
