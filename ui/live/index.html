<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempo live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#04121A; --paper:#F3F1E7; --mute:#93B4BC; --card:#FFD21F; --home:#F27A2C; --away:#6FBCEB; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#05121A; color:var(--paper); font-family:Barlow, system-ui, sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; }
  #board { position:fixed; left:24px; top:20px; display:flex; align-items:stretch; font-family:"Barlow Condensed"; font-weight:700; font-size:22px; border-radius:10px; overflow:hidden; background:rgba(4,16,24,.82); }
  #board span { padding:7px 12px; display:flex; align-items:center; gap:8px; }
  #board i { width:6px; height:18px; border-radius:2px; display:inline-block; }
  #board .clock { background:var(--paper); color:var(--ink); font-size:20px; }
  #booked { position:fixed; left:24px; top:66px; display:flex; flex-direction:column; gap:5px; font-size:13px; font-weight:600; }
  #booked div { display:flex; align-items:center; gap:7px; background:rgba(4,16,24,.7); padding:4px 9px 4px 7px; border-radius:7px; width:max-content; }
  #booked b { width:9px; height:13px; border-radius:2px; background:var(--card); display:inline-block; }
  #lower { position:fixed; left:24px; bottom:92px; font-family:"Barlow Condensed"; font-weight:700; font-size:clamp(26px, 4vw, 40px); background:rgba(4,16,24,.86); padding:8px 16px 9px; border-radius:12px; border-left:8px solid var(--card); opacity:0; transform:translateY(8px); transition:opacity .3s, transform .3s; pointer-events:none; }
  #lower.on { opacity:1; transform:none; }
  .tag { position:fixed; pointer-events:none; transform:translate(-50%,-100%); opacity:0; transition:opacity .2s; white-space:nowrap; font-family:"Barlow Condensed"; font-weight:700; font-size:20px; background:rgba(4,16,24,.86); padding:3px 10px 4px; border-radius:8px; }
  #phone { position:fixed; right:24px; top:20px; width:min(300px, 34vw); background:#071C27; border-radius:26px; padding:18px 18px 20px; box-shadow:0 18px 50px rgba(0,0,0,.45); }
  #phone h2 { font:600 13px Barlow, sans-serif; color:var(--mute); margin:0 0 10px; }
  #phone h3 { font-family:"Barlow Condensed"; font-weight:700; font-size:30px; line-height:1; margin:0 0 6px; }
  #phone p { margin:0; font-size:15px; line-height:1.4; color:#D3E3E6; }
  #meter { height:8px; border-radius:4px; background:rgba(243,241,231,.14); margin-top:12px; overflow:hidden; }
  #meter i { display:block; height:100%; width:0; background:var(--card); border-radius:4px; transition:width .25s; }
  #said { margin-top:18px; font-size:14px; line-height:1.4; color:#BFD3D8; }
  #bar { position:fixed; left:24px; right:24px; bottom:24px; display:flex; gap:14px; align-items:center; }
  button { font:600 15px Barlow, sans-serif; color:var(--ink); background:var(--paper); border:0; border-radius:10px; padding:10px 16px; cursor:pointer; min-width:74px; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--card); outline-offset:2px; }
  input[type=range] { flex:1; accent-color:var(--card); height:28px; }
  #note { font-size:13px; color:var(--mute); min-width:150px; text-align:right; }
  #err { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:40px; font-size:17px; text-align:center; }
  @media (max-width: 760px) {
    #phone { left:16px; right:16px; top:auto; bottom:84px; width:auto; border-radius:18px; padding:12px 14px 14px; }
    #phone h3 { font-size:24px; } #phone p { font-size:14px; } #said { display:none; }
    #lower { bottom:auto; top:120px; left:16px; } #board { left:16px; } #booked { left:16px; } #bar { left:16px; right:16px; } #note { display:none; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="board"><span><i style="background:var(--home)"></i><b id="hs"></b><b id="hg"></b></span><span><b id="ag"></b><b id="as"></b><i style="background:var(--away)"></i></span><span class="clock" id="clock"></span></div>
<div id="booked"></div>
<div id="lower"></div>
<div class="tag" id="tag"></div>
<aside id="phone" aria-live="polite"><h2 id="ph0"></h2><h3 id="ph1"></h3><p id="ph2"></p><div id="meter"><i></i></div><div id="said"></div></aside>
<div id="bar"><button id="play">Pause</button><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Match position"><span id="note"></span></div>
<div id="err"></div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
