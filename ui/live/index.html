<!doctype html>
<!-- The match view. With ?tour it plays the product film; ui/tour/ sends you here with that. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempo match</title>
<link rel="icon" href="../brand/tempo-small.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@500&display=swap" rel="stylesheet">
<script>
  // The page's styles carry the time of this page load, like its modules, so a browser never lays out new markup with an old sheet.
  document.write(`<link rel="stylesheet" href="live.css?v=${Date.now()}">`);
</script>
</head>
<body>
<div id="app">
  <main id="screen">
    <div id="stagewrap">
      <div id="stage"></div>
      <div id="pins"></div>
      <div id="board"><span><i style="background:var(--home)"></i><img id="hc" hidden width="28" height="28"><b id="hs"></b><b id="hg">0</b></span><span><i style="background:var(--away)"></i><img id="ac" hidden width="28" height="28"><b id="as"></b><b id="ag">0</b></span><span class="clock" id="clock">00:00</span></div>
      <div id="replaytag"><b>Replay</b><a id="replaylink" href="../replay/index.html">Watch the earlier attempt</a></div>
      <div id="counter" class="plate"><span><b id="seen">0</b> events seen</span><span><b id="shown">0</b> things shown</span></div>
      <div id="lower"><div id="kmhead" class="plate">Three things to watch, from the season so far</div><div id="form" class="plate"><h3 id="fname"></h3><p id="fval"></p><div class="scale"><i class="mid"></i><i class="dot" id="fdot"></i></div><small>Middle mark is his usual distance a minute</small><q id="fheard"></q></div><div id="label" class="plate"></div></div>
      <div id="interval"><h2 id="ih"></h2><p id="ip"></p><div id="cards"></div></div>
    </div>
    <div id="strip">
      <div id="controls"><button id="play">Pause</button><button id="speed" class="quiet" aria-label="Playback speed">1x</button><button id="prev" class="quiet" aria-label="Previous moment">Back</button><button id="next" class="quiet" aria-label="Next moment">Next moment</button></div>
      <div id="moment"></div>
      <div id="track" tabindex="0" role="slider" aria-label="Match position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><canvas id="mom"></canvas><div id="dwin"></div><div id="head"></div></div>
    </div>
  </main>
  <aside id="phone" aria-live="polite">
    <div id="brand"><svg viewBox="0 0 120 120" width="34" height="34" aria-hidden="true"><circle cx="60" cy="60" r="27.5" fill="none" stroke="#fff" stroke-width="13"/><rect x="54.9" y="6" width="10.1" height="26.5" fill="#fff"/><rect x="54.9" y="87.5" width="10.1" height="26.5" fill="#fff"/><circle id="eye" cx="60" cy="60" r="11" fill="#fff"/></svg><b>tempo</b></div>
    <div id="modes"><button data-m="en" aria-pressed="true">English</button><button data-m="ar" aria-pressed="false">عربي</button></div>
    <div id="follow" role="group" aria-label="Follow"><button data-c="-1" aria-pressed="true">Everyone</button><button data-c="0" aria-pressed="false"></button><button data-c="1" aria-pressed="false"></button></div>
    <div id="squad" role="group" aria-label="Follow one player"></div>
    <div id="depth" role="group" aria-label="How much detail"><button data-d="analyst" aria-pressed="true">Analyst</button><button data-d="fan" aria-pressed="false">Fan</button></div>
    <p id="psc"></p>
    <div id="pfollow"><h3><b id="wnum"></b><span id="wwho"></span><i id="wbook"></i></h3><p id="wclub"></p><dl><div><dt>Distance</dt><dd id="wdist"></dd></div><div><dt>Top speed</dt><dd id="wtop"></dd></div></dl></div>
    <div id="pstake"><h3><i id="pcard"></i><span id="pname"></span></h3><p id="ptext"></p><div id="meter"><i></i></div></div>
    <p id="pbig"></p>
    <div id="proof" aria-label="What stands behind this line"></div>
    <p id="pquiet"></p>
    <div id="note"></div>
  </aside>
</div>
<div id="intro"></div>
<div id="err"></div>
<script>
  // Our own modules are mapped with the time of this page load, so a browser never runs an old copy of one file against a new copy of another.
  // Every module is listed here and imported by its #name. A relative import from one module to another would miss the time stamp.
  // The lists are in loading order: each module comes after the ones it imports, and they are fetched one at a time. Asked for
  // many files in the same instant, the local server (python3 -m http.server) drops some of the connections, and one module
  // that fails to arrive stops the whole page.
  { const v = Date.now(), m = document.createElement('script'), imports = { three: 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js' };
    const lists = {
      // the match view
      page: [['util', '../shared/util.js'], ['stage', '../shared/stage.js'], ['marker', '../shared/marker.js'], ['shapes', '../shared/shapes.js'], ['intro', '../brand/intro.js'], ['live/icons', './icons.js'], ['live/match-data', './match-data.js'], ['live/pins', './pins.js'], ['live/marks', './marks.js'], ['live/plates', './plates.js'], ['live/strip', './strip.js'], ['live/follow', './follow.js'], ['live/phone', './phone.js'], ['live/cards', './cards.js'], ['main', './main.js']],
      // what the product film adds. Fetched only when the page is opened with ?tour
      film: [['portrait', '../brand/portrait.js'], ['replay/start', '../replay/start.js'], ['tour/icons', '../tour/icons.js'], ['tour/furniture', '../tour/furniture.js'], ['tour/bridge', '../tour/bridge.js'], ['tour/scenes/heads-up', '../tour/scenes/heads-up.js'], ['tour/scenes/thunderbolt', '../tour/scenes/thunderbolt.js'], ['tour/scenes/speak-of-the-devil', '../tour/scenes/speak-of-the-devil.js'], ['tour/scenes/on-a-yellow', '../tour/scenes/on-a-yellow.js'], ['tour/scenes/deja-vu', '../tour/scenes/deja-vu.js'], ['tour/scenes/called-it', '../tour/scenes/called-it.js'], ['tour/scenes/proof', '../tour/scenes/proof.js'], ['tour/scenes/close', '../tour/scenes/close.js'], ['tour/film', '../tour/film.js']],
    };
    for (const [name, path] of Object.values(lists).flat()) imports[`#${name}`] = `${path}?v=${v}`;
    m.type = 'importmap'; m.textContent = JSON.stringify({ imports });
    document.currentScript.after(m);
    // fetches one list and gives back its last module, which is the one that starts things
    window.loadModules = async (list) => { let last; for (const [name] of lists[list]) last = await import(`#${name}`); return last; }; }
</script>
<script type="module">loadModules('page');</script>
</body>
</html>
