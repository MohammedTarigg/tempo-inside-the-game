<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tempo</title>
<!-- Plays the Tempo intro by itself. Click to play it again. ?at=2 shows one still moment. -->
<link rel="icon" href="tempo-small.svg">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600&display=swap" rel="stylesheet">
<style>html, body { margin:0; height:100%; background:#000; color:#fff; } #host { height:100%; display:grid; place-items:center; cursor:pointer; }</style>
<div id="host" role="button" tabindex="0" aria-label="Play the Tempo intro again"></div>
<script>
  // Our own modules are mapped with the time of this page load, so a browser never runs an old copy of one file against a new copy of another.
  // Every module is listed here and imported by its #name. A relative import from one module to another would miss the time stamp.
  // The lists are in loading order: each module comes after the ones it imports, and they are fetched one at a time. Asked for
  // many files in the same instant, the local server (python3 -m http.server) drops some of the connections, and one module
  // that fails to arrive stops the whole page.
  { const v = Date.now(), m = document.createElement('script'), imports = {};
    const lists = {
      // the intro, by itself
      page: [['util', '../shared/util.js'], ['intro', './intro.js']],
    };
    for (const [name, path] of Object.values(lists).flat()) imports[`#${name}`] = `${path}?v=${v}`;
    m.type = 'importmap'; m.textContent = JSON.stringify({ imports });
    document.currentScript.after(m);
    // fetches one list and gives back its last module, which is the one that starts things
    window.loadModules = async (list) => { let last; for (const [name] of lists[list]) last = await import(`#${name}`); return last; }; }
</script>
<script type="module">
const { playIntro } = await loadModules('page');
const host = document.getElementById('host'), q = new URLSearchParams(location.search), at = q.get('at');
let busy = false;
async function run() { if (busy) return; busy = true; host.replaceChildren(); await playIntro(host, { at: at === null ? null : +at, hold: 0.4 }); busy = false; }
host.onclick = run; addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); run(); } });
run();
</script></html>
